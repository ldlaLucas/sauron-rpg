<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sauron RPG - Da Luz à Dominação</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer"></div>
        
        <!-- ✅ NOVO: Menu Principal -->
        <div id="main-menu-ui">
            <div class="menu-content">
                <div class="menu-title">SAURON</div>
                <div class="menu-subtitle">Da Luz à Dominação</div>
                
                <div class="menu-buttons">
                    <button id="menu-new-game" class="menu-btn">🆕 NOVO JOGO</button>
                    <button id="menu-continue" class="menu-btn">📂 CONTINUAR</button>
                    <button id="menu-options" class="menu-btn">⚙ OPÇÕES</button>
                    <button id="menu-quit" class="menu-btn">🚪 SAIR</button>
                </div>
            </div>
            
            <!-- Painel de Opções -->
            <div id="menu-options-panel">
                <div class="options-header">
                    <div class="options-title">⚙ OPÇÕES</div>
                    <button id="menu-options-close" class="options-close">FECHAR</button>
                </div>
                
                <div class="option-row">
                    <label>🔊 Volume Geral</label>
                    <input type="range" id="master-volume" min="0" max="100" value="70">
                    <span class="option-value" id="master-value">70</span>
                </div>
                
                <div class="option-row">
                    <label>🎵 Música</label>
                    <input type="range" id="music-volume" min="0" max="100" value="40">
                    <span class="option-value" id="music-value">40</span>
                </div>
                
                <div class="option-row">
                    <label>🔔 Efeitos</label>
                    <input type="range" id="sfx-volume" min="0" max="100" value="70">
                    <span class="option-value" id="sfx-value">70</span>
                </div>
            </div>
            
            <div class="menu-footer">
                Capítulo I — O Discípulo de Aulë
            </div>
        </div>
        
        <!-- Botão de Áudio -->
        <button id="audio-toggle" style="
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffd700;
            border: 2px solid #ffd700;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            font-family: Arial, sans-serif;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            display: none;
        ">🔊 Ativar Áudio</button>
        
        <!-- UI da Forja -->
        <div id="forge-ui">
            <div class="forge-container">
                <div class="forge-header">
                    <div class="forge-title">🔨 FORJA DE AULË</div>
                    <button id="forge-close" class="forge-close">FECHAR</button>
                </div>
                <div id="forge-recipes"></div>
            </div>
        </div>
        
        <!-- UI do Inventário -->
        <div id="inventory-ui">
            <div class="inventory-container">
                <div class="inventory-header">
                    <div class="inventory-title">📦 INVENTÁRIO</div>
                    <button id="inventory-close" class="inventory-close">FECHAR</button>
                </div>
                <div id="inventory-items"></div>
            </div>
        </div>
        
        <!-- UI de Save/Load -->
        <div id="save-load-ui">
            <div class="save-load-container">
                <div class="save-load-header">
                    <div class="save-load-title">💾 SALVAR/CARREGAR</div>
                    <button id="save-load-close" class="save-load-close">FECHAR</button>
                </div>
                <div id="save-info"></div>
                <div class="save-load-buttons">
                    <button id="save-btn" class="save-btn">💾 SALVAR JOGO</button>
                    <button id="load-btn" class="load-btn">📂 CARREGAR JOGO</button>
                </div>
            </div>
        </div>
                <!-- UI da Árvore de Habilidades -->
        <div id="skill-tree-ui">
            <div class="skill-tree-container">
                <div class="skill-tree-header">
                    <div class="skill-tree-title">🌳 ÁRVORE DE HABILIDADES</div>
                    <button id="skill-tree-close" class="skill-tree-close">FECHAR</button>
                </div>
                
                <div class="path-tabs">
                    <button id="path-creation" class="path-tab active">🔨 CRIAÇÃO</button>
                    <button id="path-order" class="path-tab">⚖️ ORDEM</button>
                    <button id="path-power" class="path-tab">👑 PODER</button>
                </div>
                
                <div id="skill-tree-content"></div>
            </div>
        </div>
    </div>
    
    <!-- Entidades -->
    <script src="js/entities/Entity.js"></script>
    <script src="js/entities/Pickup.js"></script>
    <script src="js/entities/CrystalPickup.js"></script>
    <script src="js/entities/NPC.js"></script>
    <script src="js/entities/Celebrimbor.js"></script>
    <script src="js/entities/ForgeObject.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/entities/TrainingDummy.js"></script>
    <script src="js/entities/CorruptedShadow.js"></script>
    <script src="js/entities/Player.js"></script>
    
    <!-- Sistemas -->
    <script src="js/systems/DialogueSystem.js"></script>
    <script src="js/systems/InventorySystem.js"></script>
    <script src="js/systems/QuestSystem.js"></script>
    <script src="js/systems/CraftingSystem.js"></script>
    <script src="js/systems/EquipmentSystem.js"></script>
    <script src="js/systems/DamageNumberSystem.js"></script>
    <script src="js/systems/MinimapSystem.js"></script>
    <script src="js/systems/CorruptionSystem.js"></script> 
    <script src="js/systems/ParticleSystem.js"></script> 
    <script src="js/systems/DamageTypeSystem.js"></script>
    
    <!-- Core -->
    <script src="js/core/SaveManager.js"></script>
    <script src="js/core/AudioManager.js"></script>
    <script src="js/core/GameLoop.js"></script>
    <script src="js/core/InputManager.js"></script>
    
    <!-- UI -->
    <script src="js/ui/MainMenuUI.js"></script>
    <script src="js/ui/ForgeUI.js"></script>
    <script src="js/ui/InventoryUI.js"></script>
    <script src="js/ui/SaveLoadUI.js"></script>
    
    <!-- Mundo -->
    <script src="js/world/TileMap.js"></script>
    
    <!-- Game -->
    <script src="js/systems/SkillTreeSystem.js"></script>
    <script src="js/ui/SkillTreeUI.js"></script>
    <script src="js/core/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
